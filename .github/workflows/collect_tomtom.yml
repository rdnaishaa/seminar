name: Collect TomTom Traffic

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil isi repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependency collector
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests python-dotenv

      # 4. Jalankan collector
      - name: Collect TomTom data
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          python auto_collect_14.py

      # 5. Commit data baru ke repository
      - name: Commit collected data
        run: |
          git config user.name "tomtom-bot"
          git config user.email "tomtom-bot@users.noreply.github.com"

          git add collected/tomtom_flow_top14.csv

          if git diff --cached --quiet; then
            echo "Tidak ada data baru untuk di-commit."
          else
            git commit -m "data: collect TomTom hourly traffic"

            git pull --rebase origin main
            git push origin main
          fi
